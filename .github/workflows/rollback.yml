name: SisConFinWeb Instant Rollback

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: 'Vercel Deployment ID ou URL da versão estável anterior para reverter'
        required: true
        type: string

jobs:
  rollback-production:
    name: 🔄 Rollback Vercel Production
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Promote Previous Stable Deployment to Production
        run: vercel promote ${{ github.event.inputs.deployment_id }} --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
